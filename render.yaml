services:
  - type: web
    name: moviebox-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PUBLIC_BASE_URL
        sync: false   # set this after deploy to https://your-app.onrender.com
